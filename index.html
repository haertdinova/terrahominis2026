<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа конференции TERRA HOMINIS – 2026</title>
    <style>
        /* --- Стили с вашим акцентным цветом #0F2D69 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            display: flex;
            width: 1300px;
            max-width: 95vw;
            height: 90vh;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background: #ffffff;
            border-right: 1px solid #e9ecf0;
            padding: 28px 16px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 20px;
            font-weight: 600;
            color: #0F2D69;
            padding-left: 12px;
            margin-bottom: 24px;
            letter-spacing: -0.2px;
        }
        .sections-list {
            list-style: none;
        }
        .section-item {
            padding: 12px 16px;
            margin-bottom: 6px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-item:hover {
            background: #f0f4fa;
            color: #0F2D69;
        }
        .section-item.active {
            background: rgba(15, 45, 105, 0.08);
            color: #0F2D69;
            font-weight: 600;
            box-shadow: inset 3px 0 0 #0F2D69;
        }
        .section-item.active .section-icon {
            color: #0F2D69;
        }
        .section-icon {
            font-size: 22px;
            transition: color 0.2s;
        }
        .main {
            flex: 1;
            background: #fafcff;
            padding: 32px 36px;
            overflow-y: auto;
        }
        .section-title {
            font-size: 32px;
            font-weight: 600;
            color: #0F2D69;
            margin-bottom: 12px;
            border-bottom: 2px solid rgba(15, 45, 105, 0.2);
            padding-bottom: 18px;
        }
        .section-description {
            color: #4a5b6f;
            margin-bottom: 32px;
            font-size: 16px;
            line-height: 1.5;
        }
        .talks-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .talk-card {
            background: white;
            padding: 22px 26px;
            border-radius: 22px;
            box-shadow: 0 4px 12px rgba(0, 20, 40, 0.03);
            border: 1px solid #eef2f6;
            transition: all 0.2s;
        }
        .talk-card:hover {
            border-color: rgba(15, 45, 105, 0.3);
            box-shadow: 0 8px 20px rgba(15, 45, 105, 0.08);
        }
        .talk-time {
            color: #0F2D69;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        .talk-title {
            font-size: 20px;
            font-weight: 600;
            color: #0b2b44;
            margin-bottom: 8px;
        }
        .talk-speaker {
            font-size: 16px;
            color: #2d4b6e;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .talk-room {
            font-size: 14px;
            color: #0F2D69;
            background: rgba(15, 45, 105, 0.05);
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            margin-top: 8px;
        }
        .placeholder {
            color: #8f9fb1;
            font-style: italic;
            padding: 40px 0;
            text-align: center;
        }
        @media (max-width: 700px) {
            .app { flex-direction: column; height: auto; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #ddd; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <h2>📋 Секции</h2>
            <ul class="sections-list" id="sectionsList"></ul>
        </div>
        <div class="main" id="mainContent">
            <div class="section-title" id="sectionTitle">Выберите секцию</div>
            <div class="section-description" id="sectionDesc"></div>
            <div class="talks-list" id="talksList"></div>
        </div>
    </div>

    <!-- Подключаем файл с данными -->
    <script src="data.js"></script>
    <script>
        function initApp() {
            if (typeof sections === 'undefined' || typeof talks === 'undefined') {
                document.getElementById('talksList').innerHTML = '<div class="placeholder">Ошибка загрузки данных</div>';
                return;
            }

            const sectionsListEl = document.getElementById('sectionsList');
            const sectionTitleEl = document.getElementById('sectionTitle');
            const sectionDescEl = document.getElementById('sectionDesc');
            const talksListEl = document.getElementById('talksList');

            window.showSection = function(sectionId) {
                const section = sections.find(s => s.id === sectionId);
                if (!section) return;

                sectionTitleEl.textContent = section.name;
                sectionDescEl.textContent = section.description;

                const sectionTalks = talks.filter(t => t.sectionId === sectionId);

                if (sectionTalks.length === 0) {
                    talksListEl.innerHTML = '<div class="placeholder">Пока нет докладов в этой секции</div>';
                } else {
                    talksListEl.innerHTML = sectionTalks.map(talk => {
                        const speakerHtml = talk.speaker ? `<div class="talk-speaker">👤 ${talk.speaker}</div>` : '';
                        const roomHtml = talk.room ? `<div class="talk-room">📍 ${talk.room}</div>` : '';
                        return `
                            <div class="talk-card">
                                <div class="talk-time">⏰ ${talk.time}</div>
                                <div class="talk-title">${talk.title}</div>
                                ${speakerHtml}
                                ${roomHtml}
                            </div>
                        `;
                    }).join('');
                }

                document.querySelectorAll('.section-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`[data-section-id="${sectionId}"]`)?.classList.add('active');
            };

            function buildMenu() {
                sectionsListEl.innerHTML = sections.map(s => `
                    <li class="section-item" data-section-id="${s.id}" onclick="showSection('${s.id}')">
                        <span class="section-icon">${s.icon}</span> ${s.name}
                    </li>
                `).join('');
                if (sections.length > 0) showSection(sections[0].id);
            }

            buildMenu();
        }

        window.onload = initApp;
    </script>
</body>
</html>
