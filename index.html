<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа конференции TERRA HOMINIS – 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <h2>📋 Секции</h2>
            <!-- Глобальный поиск -->
            <div class="global-search-container">
                <input type="text" id="globalSearchInput" class="global-search-input" placeholder="🔍 Поиск по всей программе...">
                <div id="globalSearchResults" class="global-search-results"></div>
            </div>
            <ul class="sections-list" id="sectionsList"></ul>
        </div>
        <div class="main">
            <div class="section-title" id="sectionTitle">Выберите секцию</div>
            
            <!-- Дата и адрес (оба стилизованы одинаково) -->
            <div class="section-date" id="sectionDate"></div>
            <div class="section-location" id="sectionLocation"></div>
            
            <!-- Специальное время для открытия -->
            <div class="section-special-time" id="sectionSpecialTime" style="display: none;"></div>

            <!-- Фильтры по дням и аудиториям -->
            <div class="filters-container">
                <div class="day-filters" id="dayFilters" style="display: none;"></div>
                <div class="room-filters" id="roomFilters" style="display: none;"></div>
            </div>

            <!-- Локальный поиск внутри секции -->
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск по текущей секции...">
            </div>

            <div class="talks-list" id="talksList"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
        function initApp() {
            if (typeof sections === 'undefined' || typeof talks === 'undefined') {
                document.getElementById('talksList').innerHTML = '<div class="placeholder">Ошибка загрузки данных</div>';
                return;
            }

            // DOM элементы
            const sectionsListEl = document.getElementById('sectionsList');
            const sectionTitleEl = document.getElementById('sectionTitle');
            const sectionDateEl = document.getElementById('sectionDate');
            const sectionLocationEl = document.getElementById('sectionLocation');
            const sectionSpecialTimeEl = document.getElementById('sectionSpecialTime');
            const talksListEl = document.getElementById('talksList');
            const searchInput = document.getElementById('searchInput');
            const globalSearchInput = document.getElementById('globalSearchInput');
            const globalSearchResults = document.getElementById('globalSearchResults');
            const dayFiltersEl = document.getElementById('dayFilters');
            const roomFiltersEl = document.getElementById('roomFilters');

            let currentSectionId = null;
            let currentTalks = [];
            let selectedDay = 'all';
            let selectedRoom = 'all';

            // ---------- Глобальный поиск ----------
            function performGlobalSearch() {
                const query = globalSearchInput.value.trim().toLowerCase();
                if (query === '') {
                    globalSearchResults.innerHTML = '';
                    globalSearchResults.style.display = 'none';
                    return;
                }

                const results = talks.filter(talk => 
                    (talk.title && talk.title.toLowerCase().includes(query)) ||
                    (talk.speaker && talk.speaker.toLowerCase().includes(query))
                ).map(talk => {
                    const section = sections.find(s => s.id === talk.sectionId);
                    return {
                        ...talk,
                        sectionName: section ? section.name : 'Неизвестная секция',
                        sectionId: talk.sectionId
                    };
                });

                if (results.length === 0) {
                    globalSearchResults.innerHTML = '<div class="global-search-result-item">Ничего не найдено</div>';
                } else {
                    globalSearchResults.innerHTML = results.map(res => `
                        <div class="global-search-result-item" data-section-id="${res.sectionId}" data-title="${res.title}" data-speaker="${res.speaker}">
                            <strong>${res.sectionName}</strong> — ${res.time || ''} ${res.title} (${res.speaker || 'без спикера'})
                        </div>
                    `).join('');
                }
                globalSearchResults.style.display = 'block';
            }

            let globalSearchTimer;
            globalSearchInput.addEventListener('input', () => {
                clearTimeout(globalSearchTimer);
                globalSearchTimer = setTimeout(performGlobalSearch, 300);
            });

            globalSearchInput.addEventListener('blur', () => {
                setTimeout(() => {
                    globalSearchResults.style.display = 'none';
                }, 200);
            });

            globalSearchResults.addEventListener('click', (e) => {
                const item = e.target.closest('.global-search-result-item');
                if (!item) return;
                const sectionId = item.dataset.sectionId;
                const query = globalSearchInput.value.trim();
                
                showSection(sectionId);
                searchInput.value = query;
                renderTalks();
                
                globalSearchInput.value = '';
                globalSearchResults.innerHTML = '';
                globalSearchResults.style.display = 'none';
            });

            // ---------- Фильтры по дням ----------
            function renderDayFilters() {
                const days = [...new Set(currentTalks.map(t => t.day).filter(d => d))];
                if (days.length <= 1) {
                    dayFiltersEl.style.display = 'none';
                    return;
                }
                dayFiltersEl.style.display = 'flex';
                let html = `<button class="filter-btn ${selectedDay === 'all' ? 'active' : ''}" data-day="all">Все дни</button>`;
                days.sort().forEach(day => {
                    html += `<button class="filter-btn ${selectedDay === day ? 'active' : ''}" data-day="${day}">${day}</button>`;
                });
                dayFiltersEl.innerHTML = html;

                dayFiltersEl.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedDay = btn.dataset.day;
                        renderDayFilters();
                        renderRoomFilters();
                        renderTalks();
                    });
                });
            }

            // ---------- Фильтры по аудиториям ----------
            function renderRoomFilters() {
                let talksForRooms = currentTalks;
                if (selectedDay !== 'all') {
                    talksForRooms = talksForRooms.filter(t => t.day === selectedDay);
                }
                const rooms = [...new Set(talksForRooms.map(t => t.room).filter(r => r))];
                
                if (rooms.length <= 1) {
                    roomFiltersEl.style.display = 'none';
                    selectedRoom = 'all';
                    return;
                }
                roomFiltersEl.style.display = 'flex';
                let html = `<button class="filter-btn ${selectedRoom === 'all' ? 'active' : ''}" data-room="all">Все аудитории</button>`;
                rooms.sort().forEach(room => {
                    html += `<button class="filter-btn ${selectedRoom === room ? 'active' : ''}" data-room="${room}">${room}</button>`;
                });
                roomFiltersEl.innerHTML = html;

                roomFiltersEl.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        selectedRoom = btn.dataset.room;
                        renderRoomFilters();
                        renderTalks();
                    });
                });
            }

            // ---------- Рендер докладов с группировкой по дням ----------
            function renderTalks() {
                if (!currentSectionId) return;

                const section = sections.find(s => s.id === currentSectionId);
                const searchTerm = searchInput.value.toLowerCase().trim();

                let filteredTalks = currentTalks;

                // Фильтр по дню
                if (selectedDay !== 'all') {
                    filteredTalks = filteredTalks.filter(t => t.day === selectedDay);
                }
                // Фильтр по аудитории
                if (selectedRoom !== 'all') {
                    filteredTalks = filteredTalks.filter(t => t.room === selectedRoom);
                }
                // Поиск по тексту
                if (searchTerm !== '') {
                    filteredTalks = filteredTalks.filter(talk => 
                        (talk.title && talk.title.toLowerCase().includes(searchTerm)) ||
                        (talk.speaker && talk.speaker.toLowerCase().includes(searchTerm))
                    );
                }

                if (filteredTalks.length === 0) {
                    talksListEl.innerHTML = '<div class="placeholder">Ничего не найдено</div>';
                    return;
                }

                // Группировка по дням (всегда показываем заголовки дней)
                const days = [...new Set(filteredTalks.map(t => t.day).filter(d => d))];
                let html = '';

                if (days.length === 0) {
                    // Если дней нет (например, открытие), просто выводим все карточки
                    filteredTalks.forEach(talk => {
                        const timeHtml = (talk.time && !section.specialTime) ? `<div class="talk-time">⏰ ${talk.time}</div>` : '';
                        const speakerHtml = talk.speaker ? `<div class="talk-speaker">👤 ${talk.speaker}</div>` : '';
                        html += `
                            <div class="talk-card">
                                ${timeHtml}
                                <div class="talk-title">${talk.title}</div>
                                ${speakerHtml}
                            </div>
                        `;
                    });
                } else {
                    // Сортируем дни
                    days.sort().forEach(day => {
                        const dayTalks = filteredTalks.filter(t => t.day === day);
                        html += `<div class="day-group">`;
                        html += `<div class="day-title">${day}</div>`;
                        
                        // Группировка по аудиториям внутри дня
                        const rooms = [...new Set(dayTalks.map(t => t.room).filter(r => r))];
                        if (rooms.length > 0) {
                            rooms.sort().forEach(room => {
                                const roomTalks = dayTalks.filter(t => t.room === room);
                                html += `<div class="subsection-group">`;
                                html += `<div class="subsection-title">${room}</div>`;
                                roomTalks.forEach(talk => {
                                    const timeHtml = (talk.time && !section.specialTime) ? `<div class="talk-time">⏰ ${talk.time}</div>` : '';
                                    const speakerHtml = talk.speaker ? `<div class="talk-speaker">👤 ${talk.speaker}</div>` : '';
                                    html += `
                                        <div class="talk-card">
                                            ${timeHtml}
                                            <div class="talk-title">${talk.title}</div>
                                            ${speakerHtml}
                                        </div>
                                    `;
                                });
                                html += `</div>`;
                            });
                        } else {
                            // Если аудиторий нет, просто выводим доклады дня
                            dayTalks.forEach(talk => {
                                const timeHtml = (talk.time && !section.specialTime) ? `<div class="talk-time">⏰ ${talk.time}</div>` : '';
                                const speakerHtml = talk.speaker ? `<div class="talk-speaker">👤 ${talk.speaker}</div>` : '';
                                html += `
                                    <div class="talk-card">
                                        ${timeHtml}
                                        <div class="talk-title">${talk.title}</div>
                                        ${speakerHtml}
                                    </div>
                                `;
                            });
                        }
                        html += `</div>`;
                    });
                }
                talksListEl.innerHTML = html;
            }

            // ---------- Переключение секции ----------
            window.showSection = function(sectionId) {
                const section = sections.find(s => s.id === sectionId);
                if (!section) return;

                currentSectionId = sectionId;
                currentTalks = talks.filter(t => t.sectionId === sectionId);

                // Сбрасываем фильтры
                selectedDay = 'all';
                selectedRoom = 'all';

                sectionTitleEl.textContent = section.name;
                sectionDateEl.textContent = section.date;
                sectionLocationEl.textContent = section.location;

                if (section.specialTime) {
                    sectionSpecialTimeEl.style.display = 'inline-block';
                    sectionSpecialTimeEl.textContent = `⏰ Общее время: ${section.specialTime}`;
                } else {
                    sectionSpecialTimeEl.style.display = 'none';
                }

                // Перестроить фильтры
                renderDayFilters();
                renderRoomFilters();

                // Сброс локального поиска
                searchInput.value = '';
                renderTalks();

                document.querySelectorAll('.section-item').forEach(el => el.classList.remove('active'));
                document.querySelector(`[data-section-id="${sectionId}"]`)?.classList.add('active');
            };

            // ---------- Построение меню секций ----------
            function buildMenu() {
                sectionsListEl.innerHTML = sections.map(s => `
                    <li class="section-item" data-section-id="${s.id}" onclick="showSection('${s.id}')">
                        <span class="section-icon">${s.icon}</span> ${s.name}
                    </li>
                `).join('');
                if (sections.length > 0) showSection(sections[0].id);
            }

            // Локальный поиск
            searchInput.addEventListener('input', renderTalks);

            buildMenu();
        }

        window.onload = initApp;
    </script>
</body>
</html>
